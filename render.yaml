services:
  - type: web
    name: medisync-secure
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MIN_SAFE_TEMPERATURE
        value: "15"
      - key: MAX_SAFE_TEMPERATURE
        value: "30"
      - key: MAX_SAFE_HUMIDITY
        value: "70"
